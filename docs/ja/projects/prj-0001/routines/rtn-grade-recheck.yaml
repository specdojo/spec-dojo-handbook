# yaml-language-server: $schema=../../../../specdojo/schemas/v1/routine.schema.yaml
id: rtn-grade-recheck
name: 修正済み・未評価の実践の型の週次再評価
description: 毎週火曜日6時（Asia/Tokyo）に、変更済みまたは未評価の実践の型を最大5件再評価する。
# 3 段評価が完走することを手動実行で確認できるまで無効にする。無人実行は失敗しても定刻まで
# 気づけないため、検証を経てから true へ戻す。
enabled: false
trigger:
  cron: "0 6 * * 2"
  timezone: Asia/Tokyo
action:
  kind: job
  job: job-grade-kata
  inputs:
    period: "{{scheduled_at | iso_week}}"
    kind: all
    limit: "5"
    changed_only: "true"
    ungraded: "true"
policy:
  missed_run: latest
  overlap: skip
