# yaml-language-server: $schema=../../../../specdojo/schemas/v1/routine.schema.yaml
id: rtn-grade-recheck
name: 修正済み・未評価の実践の型の夜間再評価
description: 毎晩1時（Asia/Tokyo）に、変更済みまたは未評価の実践の型を最大5件再評価する。
enabled: true
trigger:
  cron: "0 1 * * *"
  timezone: Asia/Tokyo
action:
  kind: job
  job: job-grade-kata
  inputs:
    # period は対象期間の表示用であり、Job Run や script の再開キーには使わない。
    period: "{{scheduled_at | iso_week}}"
    kind: all
    limit: "5"
    changed_only: "true"
    ungraded: "true"
policy:
  missed_run: latest
  overlap: skip
