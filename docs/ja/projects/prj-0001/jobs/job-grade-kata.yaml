# yaml-language-server: $schema=../../../../specdojo/schemas/v1/job.schema.yaml
id: job-grade-kata
name: 実践の型のローカル比較評価
description: Markdown の実践の型を比較リファレンス付きのローカル構成で全件評価する。
inputs:
  scheduled_at:
    type: string
    required: true
task:
  mode: edit
  owner: ARC
  description: |
    `specdojo grade plan --target kata --random-reference --project prj-0001` で Markdown の
    Kata 全件について1文書単位の executor plan と reporter plan を保存する。各 executor plan を
    `gemma-expert-executor` へ渡して marker 付き自由記述の最終応答を保存し、reporter plan と応答を
    `<grade_executor_output>` として `gemma-reporter` へ渡す。1件ごとに `specdojo grade apply
    --target kata --path <document> --analysis-from <executor-output> --from <json>
    --by gemma-expert-executor --reference <planに記録されたreference>` を実行する。比較リファレンスが
    ない plan では `--reference` を省略する。level・severity・finding の忠実性検証、スコア計算、
    finding 配置を完了してから次へ進み、対象がなければ result に no-op と記録する。
  paths:
    - docs/ja/specdojo/rulebooks
    - docs/ja/specdojo/recipes
    - docs/ja/specdojo/samples
    - docs/ja/specdojo/templates
run:
  idempotency_key: "{{job_id}}:{{inputs.scheduled_at}}"
