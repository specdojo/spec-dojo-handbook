# yaml-language-server: $schema=../../../../specdojo/schemas/v1/job.schema.yaml
id: job-grade-kata
name: 実践の型の継続品質評価
description: 前回の grade 以降に内容が変わった Markdown の実践の型を共通 viewpoint で評価する。
inputs:
  scheduled_at:
    type: string
    required: true
task:
  mode: edit
  owner: ARC
  description: |
    `specdojo grade plan --target kata --changed-only --project prj-0001` で1文書単位の
    executor plan と reporter plan を保存する。各文書について executor plan を分析担当へ渡し、
    JSON ではない marker 付き自由記述の最終応答を保存する。次に reporter plan と executor 応答を
    `<grade_executor_output>` として reporter へ渡し、判定を変更しない GradeSubmission JSON を得る。
    1件ごとに `specdojo grade apply --target kata --path <document>
    --analysis-from <executor-output> --from <json> --by <executor-nickname>` を実行し、level・severity・
    finding の忠実性検証、スコア計算、finding 配置を完了してから次へ進む。reporter は対象文書を
    再評価せず、executor の nickname を graded_by として指定する。対象がなければ result に no-op と
    記録する。
  paths:
    - docs/ja/specdojo/rulebooks
    - docs/ja/specdojo/recipes
    - docs/ja/specdojo/samples
    - docs/ja/specdojo/templates
run:
  idempotency_key: "{{job_id}}:{{inputs.scheduled_at}}"
