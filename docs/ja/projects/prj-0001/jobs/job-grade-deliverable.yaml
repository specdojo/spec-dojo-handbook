# yaml-language-server: $schema=../../../../specdojo/schemas/v1/job.schema.yaml
id: job-grade-deliverable
name: 成果物の継続品質評価
description: 成果物を文書単位の3段評価へ流し、最新の品質と done_criteria 充足状況を更新する。
inputs:
  period:
    type: string
    required: true
  limit:
    type: integer
    default: 0
  changed_only:
    type: boolean
    default: false
  ungraded:
    type: boolean
    default: false
task:
  mode: command
  owner: ARC
  command: |
    npm run build
    tools/grade/run-per-document.sh --run-id {{job_run_id}} --target deliverable --limit {{inputs.limit}} --changed-only={{inputs.changed_only}} --ungraded={{inputs.ungraded}}
    cat logs/grade/runs/per-document/{{job_run_id}}/results.tsv
  analysis:
    agent: gemma-reporter
    description: |
      runner が記録した command evidence の終了コードと、stdout に出力された
      `results.tsv` から次を判断して報告する。

      - 終了コード75（rate limit）または中断で未完了の段が残っているか。残る場合は同じ
        `--run-id` で再開できる状態かを確認する。
      - `failed` の段があるか。ある場合は agent 側の失敗、`grade apply` の忠実性検証、
        done_criteria の過不足のいずれかへ切り分ける。
      - 3段目が実行されなかった成果物について、閾値未満と2段目の失敗のどちらが理由か。
      - 未充足の done_criteria がある成果物と、その確認担当ロールを特定する。

      選択された成果物が0件の場合は no-op と判断する。判断できない事象は推測で埋めず、
      観測した事実と未確認の範囲を分けて報告する。
  paths:
    - docs/ja/projects/prj-0001
run:
  idempotency_key: "{{job_id}}:command-v1:{{scheduled_at}}:{{inputs.limit}}:{{inputs.changed_only}}:{{inputs.ungraded}}"
